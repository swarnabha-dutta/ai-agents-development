name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: test-and-lint

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Staging
        run: echo "Deploying to staging..."